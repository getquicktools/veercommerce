backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: site_content
    label: "Website Content"
    files:
      - name: content
        label: "All Content (edit & publish)"
        file: "content.json"
        fields:
          - label: "Business Details"
            name: site
            widget: object
            fields:
              - { label: "Business Name", name: name, widget: string }
              - { label: "Tagline", name: tagline, widget: string }
              - { label: "Email", name: email, widget: string }
              - { label: "Phone (display)", name: phoneDisplay, widget: string }
              - { label: "WhatsApp number (country code + number, no +)", name: whatsapp, widget: string }
              - { label: "CEO Name", name: ceoName, widget: string }
              - { label: "CEO Title", name: ceoTitle, widget: string }
              - { label: "Top bar note", name: topbarNote, widget: string }
          - label: "Hero (top section)"
            name: hero
            widget: object
            fields:
              - { label: "Badge", name: badge, widget: string }
              - { label: "Title part 1", name: titleA, widget: string }
              - { label: "Title part 2 (orange)", name: titleB, widget: string }
              - { label: "Title part 3", name: titleC, widget: string }
              - { label: "Subtitle", name: subtitle, widget: text }
          - label: "Platforms (chips)"
            name: platforms
            widget: list
            field: { label: "Platform", name: item, widget: string }
          - label: "Trust Bar"
            name: trustBar
            widget: list
            fields:
              - { label: "Icon (emoji)", name: icon, widget: string }
              - { label: "Text", name: text, widget: string }
          - label: "Services"
            name: services
            widget: list
            fields:
              - { label: "Icon (letter/symbol)", name: icon, widget: string }
              - { label: "Colour (hex)", name: color, widget: string }
              - { label: "Title", name: title, widget: string }
              - { label: "Short text", name: text, widget: string }
          - label: "Stats Bar"
            name: stats
            widget: list
            fields:
              - { label: "Icon (emoji)", name: icon, widget: string }
              - { label: "Value", name: value, widget: string }
              - { label: "Label", name: label, widget: string }
          - label: "Process Steps"
            name: process
            widget: list
            fields:
              - { label: "Title", name: title, widget: string }
              - { label: "Text", name: text, widget: text }
          - label: "Pricing Packages"
            name: pricing
            widget: list
            fields:
              - { label: "Package name", name: name, widget: string }
              - { label: "Price", name: price, widget: string }
              - { label: "Delivery", name: delivery, widget: string }
              - { label: "Most popular?", name: popular, widget: boolean, required: false }
              - label: "Features"
                name: features
                widget: list
                field: { label: "Feature", name: item, widget: string }
          - label: "About Section"
            name: about
            widget: object
            fields:
              - { label: "Title", name: title, widget: string }
              - { label: "Text", name: text, widget: text }
              - label: "Checklist points"
                name: points
                widget: list
                field: { label: "Point", name: item, widget: string }
          - label: "FAQs"
            name: faqs
            widget: list
            fields:
              - { label: "Question", name: q, widget: string }
              - { label: "Answer", name: a, widget: text }
